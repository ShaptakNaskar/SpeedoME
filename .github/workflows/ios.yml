# A version tag starts exactly one workflow. Android is built/signed locally and uploaded to the
# draft release; this job adds the unsigned IPA and publishes only when both assets are present.
name: Release
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'iOS manual build' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen --spec iosApp/project.yml
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' iosApp/Info.plist)
          test "$version" = "${RELEASE_TAG#v}"
      - name: Build the app, unsigned
        run: >
          xcodebuild -project iosApp/SpeedoME.xcodeproj -scheme SpeedoME -configuration Release
          -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Package the IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/SpeedoME.app build/ipa/Payload/
          find build/ipa/Payload/SpeedoME.app -name THIRD_PARTY_NOTICES.txt -print -quit | grep -q .
          cd build/ipa && zip -qr ../SpeedoME-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedoME-ios-unsigned
          path: build/SpeedoME-unsigned.ipa
      - name: Attach the IPA and publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          ipa="SpeedoME-$version-unsigned.ipa"
          cp build/SpeedoME-unsigned.ipa "build/$ipa"
          gh release upload "$RELEASE_TAG" "build/$ipa" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > build/release-assets.txt
          test "$(wc -l < build/release-assets.txt | tr -d ' ')" = 2
          grep -Fx "SpeedoME-$version.apk" build/release-assets.txt
          grep -Fx "$ipa" build/release-assets.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
