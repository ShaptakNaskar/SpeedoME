# Builds an unsigned SpeedoME.ipa on GitHub's free macOS runner (free for public repos).
# Download it from the run's Artifacts, sign it with your own certificate, install it.
name: iOS build

on:
  push:
    branches: [main]
    paths:
      - engine/**
      - ios/**
      - iosApp/**
      - gradle/**
      - "*.gradle.kts"
      - .github/workflows/ios.yml
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Kotlin framework
        run: ./gradlew :ios:linkReleaseFrameworkIosArm64
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen --spec iosApp/project.yml
      - name: Build the app, unsigned
        run: >
          xcodebuild -project iosApp/SpeedoME.xcodeproj -scheme SpeedoME -configuration Release
          -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Package the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/SpeedoME.app build/ipa/Payload/
          cd build/ipa && zip -qr ../SpeedoME-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedoME-ios-unsigned
          path: build/SpeedoME-unsigned.ipa
